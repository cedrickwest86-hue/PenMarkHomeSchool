# Cloudflare deploys this worker from GitHub (Workers & Pages → Import a repository, root directory: worker).
name = "homeschool-ai"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Keep the settings you enter in the Cloudflare dashboard (Settings → Variables and Secrets).
# Without this, every deploy from GitHub would erase them.
keep_vars = true

# Settings to add in the dashboard (not here, so nothing private ends up in GitHub):
#   ANTHROPIC_API_KEY   Secret   your Anthropic key
#   ALLOWED_ORIGINS     Text     https://YOUR-GITHUB-NAME.github.io
#   SUPABASE_URL        Text     https://YOUR-PROJECT.supabase.co
#   SUPABASE_ANON_KEY   Text     your anon / publishable key
#   MODEL               Text     claude-sonnet-5-5 (optional; this is the default)
